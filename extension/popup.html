<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Max Usage</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111;
      --muted: #666;
      --line: #e5e5e5;
      --accent: #2563eb;
      --good: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --fg: #f5f5f5;
        --muted: #999;
        --line: #2a2a2a;
        --accent: #60a5fa;
      }
    }
    html, body { margin: 0; padding: 0; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      width: 280px;
      padding: 14px 16px 12px;
    }
    h1 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-of-type { border-bottom: none; }
    .label { color: var(--muted); font-size: 12px; }
    .val { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pct { font-size: 15px; }
    .reset { font-size: 10px; color: var(--muted); margin-top: 1px; display: block; }
    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; padding: 12px 0; text-align: center; }
    .high { color: var(--bad); }
    .mid { color: var(--warn); }
    .low { color: var(--good); }
  </style>
</head>
<body>
  <h1>Claude Max — <span id="plan">—</span></h1>
  <div id="content"></div>
  <div class="footer">
    <span id="updated">—</span>
    <span>
      <button id="refresh">refresh</button>
    </span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
